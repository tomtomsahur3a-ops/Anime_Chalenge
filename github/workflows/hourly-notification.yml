name: Send Hourly Sawn Notification

on:
  schedule:
    - cron: '0 * * * *' # تنفيذ السكريبت في الدقيقة 0 من كل ساعة تماماً
  workflow_dispatch: # يتيح لك زراً لتشغيل الأتمتة يدوياً للتجربة متى شئت

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run notification script
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node send-notification.js
