<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل وتحدي الأوتاكو 🏆</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      direction: rtl;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }

    .hidden { display: none !important; }

    .main-title { text-align: center; font-size: 1.8rem; color: #38bdf8; margin-bottom: 20px; }

    .section-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
    }

    .section-title {
      font-size: 1.2rem;
      color: #facc15;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .btn-start {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 1.1rem;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-start:hover { background: var(--accent-hover); }

    .recommendation-card {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed #334155;
    }

    .rec-name { color: #38bdf8; font-size: 1.4rem; margin-bottom: 6px; }
    .genre-badge { display: inline-block; background: #334155; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 12px; color: #cbd5e1; }
    .warning-box { color: #fca5a5; font-size: 0.85rem; line-height: 1.5; background: #450a0a; padding: 10px; border-radius: 8px; border-right: 4px solid #ef4444; text-align: right; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; max-height: 250px; overflow-y: auto; margin-top: 14px; }
    .anime-btn { background: #334155; border: none; color: var(--text); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; text-align: center; }
    .anime-btn:hover { background: #475569; }

    .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .difficulty-badge { font-size: 0.8rem; font-weight: bold; padding: 6px 12px; border-radius: 20px; background: #334155; }
    .timer { font-size: 1rem; font-weight: bold; color: #f59e0b; background: #451a03; padding: 4px 10px; border-radius: 8px; border: 1px solid #78350f; }

    .question-text { font-size: 1.15rem; margin-bottom: 20px; line-height: 1.5; text-align: right; }
    .options-list { display: flex; flex-direction: column; gap: 10px; }

    .option-btn { background: #334155; border: 2px solid transparent; color: var(--text); padding: 12px 14px; border-radius: 8px; cursor: pointer; text-align: right; font-size: 0.95rem; }
    .option-btn.correct { background-color: var(--correct) !important; color: #fff; }
    .option-btn.wrong { background-color: var(--wrong) !important; color: #fff; }

    .result-card { text-align: center; padding: 10px 0; }
    .result-title { font-size: 1.6rem; color: #facc15; margin-bottom: 12px; }
    .result-msg { font-size: 1rem; line-height: 1.5; margin-bottom: 20px; }
    .action-btn { background: var(--accent); color: white; border: none; padding: 10px 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 4px; }
    .share-btn { background: #0284c7; }
  </style>
</head>
<body>

  <div class="container">

      <div class="section-card">

        <div id="recommendation-card" class="recommendation-card hidden">

          </div>
        </div>
      </div>

      <div class="section-card">
        <h2 class="section-title">تحدي الأوتاكو</h2>
        <button class="btn-start" onclick="showAnimeGrid()">ابدأ</button>

        <div id="anime-grid-container" class="hidden">
          <div class="grid" id="anime-grid"></div>
        </div>
      </div>
    </div>

    <div id="game-screen" class="hidden">
      <div class="header-info">
        <span id="difficulty-tag" class="difficulty-badge">🟢 مستوى: مبتدئ</span>
        <span id="timer" class="timer">30s</span>
      </div>
      <h2 id="question-text" class="question-text">جاري تحميل السؤال...</h2>
      <div id="options-container" class="options-list"></div>
    </div>

    <div id="result-screen" class="hidden">
      <div class="result-card">
        <h1 id="result-title" class="result-title">إنجاز أسطوري! 🎉</h1>
        <p id="result-msg" class="result-msg"></p>
        <button class="action-btn share-btn" onclick="shareChallenge()">📤 شارك التحدي</button>
        <button class="action-btn" onclick="resetToHome()">🔄 القائمة الرئيسية</button>
      </div>
    </div>
  </div>

    let selectedAnime = "";
    let currentLevel = 0;
    let timerInterval = null;
    let timeLeft = 30;

    function recommendRandomAnime() {
      const random = animeData[Math.floor(Math.random() * animeData.length)];
      document.getElementById("rec-title").innerText = random.name;
      document.getElementById("rec-genre").innerText = `التصنيف: ${random.genre}`;
      document.getElementById("recommendation-card").classList.remove("hidden");
    }

    function showAnimeGrid() {
      const grid = document.getElementById("anime-grid");
      grid.innerHTML = "";
      // إظهار الأنميات الـ 10 المحددة للتحدي فقط
      Object.keys(questionsBank).forEach(name => {
        const btn = document.createElement("button");
        btn.className = "anime-btn";
        btn.innerText = name;
        btn.onclick = () => startGame(name);
        grid.appendChild(btn);
      });
      document.getElementById("anime-grid-container").classList.remove("hidden");
    }

    function startGame(animeName) {
      selectedAnime = animeName;
      currentLevel = 0;
      document.getElementById("selection-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("game-screen").classList.remove("hidden");
      loadQuestion();
    }

    function loadQuestion() {
      if (currentLevel >= 10) { showWinScreen(); return; }

      document.getElementById("difficulty-tag").innerText = difficultyLevels[currentLevel];
      resetTimer();

      const qData = questionsBank[selectedAnime][currentLevel];

      document.getElementById("question-text").innerText = qData.q;
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      qData.options.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = optText;
        btn.onclick = () => selectAnswer(btn, index === qData.a);
        optionsContainer.appendChild(btn);
      });
    }

    function selectAnswer(btn, isCorrect) {
      clearInterval(timerInterval);
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(b => b.disabled = true);

      if (isCorrect) {
        btn.classList.add("correct");
        setTimeout(() => { currentLevel++; loadQuestion(); }, 1000);
      } else {
        btn.classList.add("wrong");
        setTimeout(() => { alert("إجابة خاطئة! حاول مرة أخرى."); resetToHome(); }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = 30;
      const timerEl = document.getElementById("timer");
      timerEl.innerText = `${timeLeft}s`;
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.innerText = `${timeLeft}s`;
        if (timeLeft <= 0) { clearInterval(timerInterval); alert("انتهى الوقت!"); resetToHome(); }
      }, 1000);
    }

    function showWinScreen() {
      document.getElementById("game-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
      const randomMsg = winMessages[Math.floor(Math.random() * winMessages.length)];
      document.getElementById("result-msg").innerText = randomMsg;
      if (typeof confetti === "function") { confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); }
    }

    function shareChallenge() {
      const text = `حققت 10/10 في تحدي أنمي ${selectedAnime}! 🏆 هل تستطيع التغلب علي؟`;
      if (navigator.share) { navigator.share({ title: 'تحدي الأوتاكو', text: text }); }
      else { alert("تم نسخ نص التحدي!"); }
    }

    function resetToHome() {
      clearInterval(timerInterval);
      document.getElementById("game-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("selection-screen").classList.remove("hidden");
      document.getElementById("recommendation-card").classList.add("hidden");
      document.getElementById("anime-grid-container").classList.add("hidden");
    }
